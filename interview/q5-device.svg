<svg xmlns="http://www.w3.org/2000/svg" width="950" height="730" font-family="Helvetica, Arial, sans-serif">
<rect width="950" height="730" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Q5. Device: where you play</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">a. Desktop only</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Laptop, 1280x720 or more</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Keyboard and mouse</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">60 fps, 150 draw calls max</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Phone shows &#x27;play on a laptop&#x27;</text>
<text x="70" y="620" font-size="18" fill="#475569">Theo&#x27;s pick. Less test work.</text>
<text x="70" y="644" font-size="18" fill="#475569">Phone halves the 3D budget.</text>
<rect x="490" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">b. Desktop first, phone later</text>
<rect x="760" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="825" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">M1-M3: laptop, keyboard</text>
<text x="700.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">and mouse</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Complete version: phone in</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">landscape, low quality preset</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Touch controls 48 px or more,</text>
<text x="700.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">30 fps</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Test on 1 real phone</text>
<text x="520" y="620" font-size="18" fill="#475569">Viet, Lena and Emil pick this.</text>
<text x="520" y="644" font-size="18" fill="#475569">More work only at the end.</text>
</svg>