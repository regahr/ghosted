<svg xmlns="http://www.w3.org/2000/svg" width="950" height="825" font-family="Helvetica, Arial, sans-serif">
<rect width="950" height="825" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Q2. Sign-in: what you see when you open the game</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">a. Google first</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">You open the site</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Sign in with Google button</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Supabase session starts</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">3D hub. Run 1 is saved</text>
<text x="250.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">to the cloud from the start</text>
<text x="70" y="620" font-size="18" fill="#475569">Matches your ask: &#x27;authenticated</text>
<text x="70" y="644" font-size="18" fill="#475569">using google&#x27;. One more click at the start.</text>
<rect x="490" y="110" width="420" height="675" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">b. Guest first</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">You open the site</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Play as guest</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">(run starts in &lt; 10 s)</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Run is saved on this device only</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Later: &#x27;Link Google to save&#x27;</text>
<line x1="700.0" y1="575" x2="700.0" y2="597" stroke="#334155" stroke-width="3"/><polygon points="692.0,589 708.0,589 700.0,600" fill="#334155"/>
<rect x="520" y="600" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="630" font-size="19" fill="#1e1b4b" text-anchor="middle">Guest save merges into account</text>
<text x="520" y="715" font-size="18" fill="#475569">Faster start. More build and test work</text>
<text x="520" y="739" font-size="18" fill="#475569">(save merge between 2 states).</text>
</svg>