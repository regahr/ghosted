<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="825" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Q1. LinkedIn finale: what happens after you win an offer</text>
<rect x="40" y="110" width="420" height="675" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">a. Share link + copy text</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">You win the offer</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">In-game post with your run</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">stats: 47 sent, 31 ghosts</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">You tap Copy text, then Share</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">LinkedIn opens its share window</text>
<text x="250.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">with your &#x27;I got the job&#x27; card</text>
<line x1="250.0" y1="575" x2="250.0" y2="597" stroke="#334155" stroke-width="3"/><polygon points="242.0,589 258.0,589 250.0,600" fill="#334155"/>
<rect x="70" y="600" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="630" font-size="19" fill="#1e1b4b" text-anchor="middle">You paste the text and post</text>
<text x="70" y="715" font-size="18" fill="#475569">Build: about 1 day.</text>
<text x="70" y="739" font-size="18" fill="#475569">No LinkedIn app, no review, no token.</text>
<rect x="490" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">b. Image card only</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">You win the offer</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Game makes the card image</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">You tap Download PNG</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">You post it by hand, later</text>
<text x="520" y="620" font-size="18" fill="#475569">Build: half a day.</text>
<text x="520" y="644" font-size="18" fill="#475569">Nothing goes to LinkedIn from the game.</text>
<rect x="940" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">c. (a) now, API post in M3</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">M1-M2: same as (a)</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">M3: second LinkedIn sign-in</text>
<text x="1150.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">(w_member_social scope)</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Confirm screen shows the</text>
<text x="1150.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">full post text</text>
<line x1="1150.0" y1="480" x2="1150.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="1142.0,494 1158.0,494 1150.0,505" fill="#334155"/>
<rect x="970" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Game posts to your real profile</text>
<text x="970" y="620" font-size="18" fill="#475569">Needs a LinkedIn developer app.</text>
<text x="970" y="644" font-size="18" fill="#475569">Token lasts about 60 days (not proved).</text>
</svg>