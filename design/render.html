<script type="module">
import * as THREE from 'three';
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.NeutralToneMapping; renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

// ---------- palette (Lena 24 + seat accents) ----------
const P = {
  grass:'#B5D67A', grassDeep:'#7FA65A', path:'#EBD3A6', plinth:'#E59F64', wood:'#7A4A2E',
  cafeWall:'#F4A672', cafeRoof:'#D4503A', atsWall:'#A8C4DC', atsRoof:'#3D6B99', hqWall:'#C9A6D6', hqRoof:'#7A5596',
  cream:'#FFE8A6', gold:'#F0B43C', shirt:'#2F6FDB', skin:'#F2C79E', ghost:'#F8F4EA', suit:'#2E2C3D', robot:'#8E9BA8',
  purple:'#6B3FC9', teal:'#2FB8AE', redInk:'#B23A26', ink:'#2B1E16', panel:'#FFF8EE', panelEdge:'#E9D3B4',
  hair:'#4A3226', tie:'#E0533D', legs:'#2F3E5C', shoes:'#3A2A22', coral:'#E2574C', lilac:'#E3D3EE', sky:'#CFE3F0'
};
const gradTex = n => { const d = n===3 ? [150,150,150,255,205,205,205,255,255,255,255,255] : [178,178,178,255,255,255,255,255];
  const t = new THREE.DataTexture(new Uint8Array(d), n, 1); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; };
const G2 = gradTex(2), G3 = gradTex(3);
const matCache = {};
function toon(c, opts={}){ const k = c+JSON.stringify(opts); if (!opts.fresh && matCache[k]) return matCache[k];
  const m = new THREE.MeshToonMaterial({color:c, gradientMap: opts.face?G3:G2, transparent: opts.opacity!==undefined, opacity: opts.opacity ?? 1, emissive: opts.emissive||'#000000', emissiveIntensity: opts.ei ?? 1});
  if (!opts.fresh) matCache[k] = m; return m; }
const inkMat = new THREE.MeshBasicMaterial({color:P.ink});
const whiteMat = new THREE.MeshBasicMaterial({color:'#ffffff'});
function outlineMat(th){ const m = new THREE.MeshBasicMaterial({color:P.ink, side:THREE.BackSide});
  m.onBeforeCompile = s => { s.vertexShader = s.vertexShader.replace('#include <begin_vertex>', `vec3 transformed = position + normal * ${th.toFixed(4)};`); }; return m; }
const OUT = outlineMat(0.012), OUT_BIG = outlineMat(0.05);
function outline(root, big=false){ const list=[]; root.traverse(o => { if (o.isMesh && !o.userData.noOutline && !o.userData.isOutline) list.push(o); });
  for (const o of list) { const h = new THREE.Mesh(o.geometry, big?OUT_BIG:OUT); h.userData.isOutline = true; h.castShadow=false; o.add(h); } return root; }
function mesh(geo, mat, pos=[0,0,0], rot=[0,0,0], scl=[1,1,1]){ const m = new THREE.Mesh(geo, mat); m.position.set(...pos); m.rotation.set(...rot); m.scale.set(...scl); m.castShadow = true; m.receiveShadow = !!window.__recv; return m; }
const noOut = m => (m.userData.noOutline = true, m);

// ---------- face (head space: head radius 0.5) ----------
function face(expr){
  const f = new THREE.Group();
  const eye = (x, sx=1, sy=1, hl=1) => { const e = noOut(mesh(new THREE.SphereGeometry(0.07,12,10), inkMat, [x,0.02,0.45], [0,0,0], [0.7*sx,1*sy,0.4])); f.add(e);
    for (let i=0;i<hl;i++) f.add(noOut(mesh(new THREE.SphereGeometry(0.022,8,6), whiteMat, [x+0.02-i*0.035,0.06-i*0.05,0.49]))); };
  const brow = (x, y, tilt) => f.add(noOut(mesh(new THREE.BoxGeometry(0.12,0.025,0.02), inkMat, [x,y,0.47], [0,0,tilt])));
  const arcMouth = (arc, r=0.08, y=-0.13, up=false) => { const m = noOut(mesh(new THREE.TorusGeometry(r,0.018,6,20,arc), inkMat, [0,y,0.47]));
    m.rotation.z = up ? (Math.PI-arc)/2 : Math.PI + (Math.PI-arc)/2; f.add(m); };
  const cheeks = () => { for (const x of [-0.25,0.25]) { const c = noOut(mesh(new THREE.CircleGeometry(0.06,16), new THREE.MeshBasicMaterial({color:'#f28c8c', transparent:true, opacity:0.6}), [x,-0.07,0.425], [0,x>0?0.55:-0.55,0])); f.add(c); } };
  const sweat = () => { const s = new THREE.Group(); s.add(noOut(mesh(new THREE.SphereGeometry(0.045,10,8), new THREE.MeshBasicMaterial({color:'#9fd3ff'})))); s.add(noOut(mesh(new THREE.ConeGeometry(0.045,0.07,10), new THREE.MeshBasicMaterial({color:'#9fd3ff'}), [0,0.05,0]))); s.position.set(0.33,0.18,0.33); f.add(s); };
  if (expr==='hopeful'){ eye(-0.15,1,1.15); eye(0.15,1,1.15); brow(-0.15,0.2,0.1); brow(0.15,0.2,-0.1); arcMouth(0.8*Math.PI); cheeks(); }
  if (expr==='ghosted'){ eye(-0.15,0.5,0.5,0); eye(0.15,0.5,0.5,0); brow(-0.15,0.16,0); brow(0.15,0.16,0); f.add(noOut(mesh(new THREE.CapsuleGeometry(0.015,0.08,2,6), inkMat, [0,-0.13,0.47], [0,0,Math.PI/2]))); sweat(); }
  if (expr==='rejected'){ for (const x of [-0.15,0.15]) { const a = 0.6*Math.PI; const m = noOut(mesh(new THREE.TorusGeometry(0.06,0.016,6,16,a), inkMat, [x,0.0,0.47])); m.rotation.z = (Math.PI-a)/2; f.add(m); }
    brow(-0.15,0.18,0.05); brow(0.15,0.18,-0.05); arcMouth(0.9*Math.PI, 0.1); sweat(); }
  if (expr==='focused'){ eye(-0.15,1,0.5,1); eye(0.15,1,0.5,1); brow(-0.15,0.13,-0.26); brow(0.15,0.13,0.26); f.add(noOut(mesh(new THREE.CapsuleGeometry(0.015,0.06,2,6), inkMat, [0.04,-0.14,0.47], [0,0,Math.PI/2]))); }
  if (expr==='joy'){ eye(-0.15,1.3,1.3,2); eye(0.15,1.3,1.3,2); brow(-0.15,0.24,0.15); brow(0.15,0.24,-0.15);
    const m = noOut(mesh(new THREE.SphereGeometry(0.12,16,8,0,Math.PI*2,Math.PI/2,Math.PI/2), inkMat, [0,-0.1,0.44], [0,0,0], [1,1,0.45])); f.add(m);
    f.add(noOut(mesh(new THREE.SphereGeometry(0.05,10,8), new THREE.MeshBasicMaterial({color:P.coral}), [0,-0.18,0.47], [0,0,0], [1,0.6,0.4]))); cheeks(); }
  if (expr==='smile'){ eye(-0.15); eye(0.15); arcMouth(0.7*Math.PI); }
  if (expr==='wide'){ eye(-0.15); eye(0.15); arcMouth(0.95*Math.PI, 0.13, -0.1); brow(-0.15,0.22,0.1); brow(0.15,0.22,-0.1); }
  if (expr==='smug'){ eye(-0.15,1,0.6); eye(0.15,1,0.6); const m = noOut(mesh(new THREE.TorusGeometry(0.07,0.018,6,16,0.6*Math.PI), inkMat, [0.05,-0.13,0.47])); m.rotation.z = Math.PI*1.25; f.add(m); brow(-0.15,0.17,0.15); brow(0.15,0.19,-0.05); }
  if (expr==='dots'){ eye(-0.15,0.6,0.6,0); eye(0.15,0.6,0.6,0); }
  return f;
}

// ---------- pawn (hero and NPC base) ----------
// metres: total 0.95 m, head r 0.18 (2.6 head-heights)
function pawn(o={}){
  const s = o.scale || 1, g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const shirt = toon(o.shirt || P.shirt), skin = toon(o.skin || P.skin, {face:true});
  for (const x of [-0.08,0.08]) {
    body.add(mesh(new THREE.BoxGeometry(0.1,0.06,0.16), toon(o.shoes || P.shoes), [x,0.03,0.02]));
    body.add(mesh(new THREE.CylinderGeometry(0.06,0.06,0.14,8), toon(o.legs || P.legs), [x,0.12,0]));
  }
  if (o.skirt) body.add(mesh(new THREE.CylinderGeometry(0.13,0.23,0.3,16), shirt, [0,0.3,0]));
  body.add(mesh(new THREE.CapsuleGeometry(0.19,0.16,6,16), shirt, [0,0.45,0]));
  if (o.collar !== false) body.add(mesh(new THREE.TorusGeometry(0.11,0.028,6,16), toon(o.collarColor||'#ffffff'), [0,0.66,0], [Math.PI/2,0,0]));
  if (o.tie) { body.add(mesh(new THREE.BoxGeometry(0.06,0.06,0.03), toon(o.tie), [0,0.62,0.17])); body.add(mesh(new THREE.BoxGeometry(0.07,0.18,0.03), toon(o.tie), [0,0.51,0.18], [0.08,0,0])); }
  const armL = new THREE.Group(), armR = new THREE.Group();
  for (const [arm, sx] of [[armL,-1],[armR,1]]) { arm.position.set(0.2*sx,0.6,0);
    arm.add(mesh(new THREE.CapsuleGeometry(0.05,0.18,4,8), shirt, [0.02*sx,-0.13,0]));
    arm.add(mesh(new THREE.SphereGeometry(0.055,10,8), skin, [0.03*sx,-0.27,0]));
    arm.rotation.z = 0.2*sx; body.add(arm); }
  g.userData.armL = armL; g.userData.armR = armR;
  const head = new THREE.Group(); head.position.y = 0.79; body.add(head); g.userData.head = head;
  head.add(mesh(new THREE.SphereGeometry(0.18,20,16), skin));
  const hairC = o.hair || P.hair;
  if (o.hairStyle !== 'none') head.add(mesh(new THREE.SphereGeometry(0.19,20,10,0,Math.PI*2,0,Math.PI*0.42), toon(hairC), [0,0.005,-0.015], [-0.25,0,0]));
  if (o.hairStyle === 'bun') head.add(mesh(new THREE.SphereGeometry(0.09,12,10), toon(hairC), [0,0.17,-0.1]));
  if (o.hairStyle === 'swoop') head.add(mesh(new THREE.SphereGeometry(0.1,12,10), toon(hairC), [0.07,0.15,0.06], [0,0,0], [1.4,0.6,1]));
  if (o.sprout) { const sp = new THREE.Group(); sp.position.set(0,0.17,-0.02); sp.add(mesh(new THREE.ConeGeometry(0.028,0.12,6), toon(hairC), [0,0.06,0])); sp.rotation.x = -(o.sproutDroop ?? 0.35); sp.scale.y = o.sproutScale || 1; head.add(sp); g.userData.sprout = sp; }
  const fc = face(o.expr || 'smile'); fc.scale.setScalar(0.36); head.add(fc);
  if (o.glasses) for (const x of [-0.055,0.055]) head.add(noOut(mesh(new THREE.TorusGeometry(0.04,0.008,6,16), inkMat, [x,0.01,0.175])));
  g.scale.setScalar(s);
  return g;
}
function hero(o={}){
  const outfit = o.outfit || 'smart';
  const shirt = {smart:P.shirt, cosy:'#E9D8B8', night:'#4A4A58'}[outfit] || P.shirt;
  const h = pawn({shirt, tie: outfit==='smart'||o.cos==='blazer' ? P.tie : null, collar: outfit!=='cosy', sprout:true, expr:o.expr||'hopeful',
    sproutDroop:o.sproutDroop, sproutScale:o.sproutScale});
  const body = h.children[0];
  if (outfit==='cosy') body.add(mesh(new THREE.TorusGeometry(0.12,0.045,8,18), toon('#22A06B'), [0,0.66,0], [Math.PI/2,0,0]));
  if (outfit==='night') h.userData.head.add(mesh(new THREE.SphereGeometry(0.195,20,10,0,Math.PI*2,0,Math.PI*0.45), toon(P.gold), [0,0.02,0], [-0.15,0,0]));
  // lanyard badge
  body.add(mesh(new THREE.BoxGeometry(0.06,0.08,0.015), toon('#ffffff'), [-0.09,0.5,0.19], [0.12,0,0]));
  body.add(noOut(mesh(new THREE.BoxGeometry(0.04,0.012,0.016), toon(P.shirt), [-0.09,0.52,0.198], [0.12,0,0])));
  // briefcase
  if (o.briefcase !== false) { const bc = new THREE.Group(); bc.add(mesh(new THREE.BoxGeometry(0.22,0.16,0.06), toon('#8A5A3B'))); bc.add(mesh(new THREE.TorusGeometry(0.04,0.01,6,12,Math.PI), toon('#5a3a22'), [0,0.08,0])); bc.position.set(0.27,0.24,0); body.add(bc); }
  if (o.cos==='blazer') { body.add(mesh(new THREE.CapsuleGeometry(0.205,0.12,6,16,), toon('#2B3A67'), [0,0.46,-0.015], [0,0,0], [1,1,0.92]));
    for (const x of [-0.07,0.07]) body.add(mesh(new THREE.BoxGeometry(0.05,0.16,0.02), toon('#22305a'), [x,0.56,0.18], [0.2,0,x>0?-0.35:0.35]));
    body.add(mesh(new THREE.SphereGeometry(0.018,8,6), toon(P.gold), [0,0.42,0.205])); body.add(mesh(new THREE.BoxGeometry(0.06,0.18,0.03), toon(P.tie), [0,0.52,0.19])); }
  if (o.cos==='hoodie') { body.children.forEach(c=>{ if (c.material===toon(shirt)) c.material = toon('#8B5CF6'); });
    h.userData.armL.children[0].material = h.userData.armR.children[0].material = toon('#8B5CF6');
    body.add(mesh(new THREE.TorusGeometry(0.15,0.05,8,16,Math.PI), toon('#7c4fe0'), [0,0.7,-0.1], [0.4,0,0]));
    body.add(mesh(new THREE.BoxGeometry(0.2,0.07,0.03), toon('#7c4fe0'), [0,0.36,0.185], [0.2,0,0]));
    const gh = ghostDecal(); gh.position.set(0.06,0.5,0.2); body.add(gh); }
  if (o.cos==='headphones') { const hd = h.userData.head; hd.add(mesh(new THREE.TorusGeometry(0.2,0.022,6,20,Math.PI), toon(P.gold), [0,0.02,0], [0,Math.PI/2,0]));
    for (const x of [-0.2,0.2]) hd.add(mesh(new THREE.CylinderGeometry(0.07,0.07,0.06,14), toon('#2B1E16'), [x,0,0], [0,0,Math.PI/2])); }
  if (o.cos==='hat') { const hd = h.userData.head; const hat = new THREE.Group(); hat.add(mesh(new THREE.ConeGeometry(0.09,0.22,10), toon(P.coral))); hat.add(mesh(new THREE.SphereGeometry(0.03,8,6), toon('#FFFAF2'), [0,0.12,0]));
    for (let i=0;i<3;i++) hat.add(noOut(mesh(new THREE.TorusGeometry(0.075-i*0.022,0.01,4,14), toon('#FFFAF2'), [0,-0.07+i*0.06,0], [Math.PI/2,0,0])));
    hat.position.set(0.05,0.24,0); hat.rotation.z = -0.25; hd.add(hat); if (h.userData.sprout) h.userData.sprout.visible=false; }
  if (o.pose==='thumbs') { h.userData.armR.rotation.z = 2.3; }
  if (o.pose==='cheer') { h.userData.armR.rotation.z = 2.6; h.userData.armL.rotation.z = -2.6; }
  outline(h); return h;
}
function ghostDecal(){ const g = new THREE.Group(); g.add(noOut(mesh(new THREE.CircleGeometry(0.04,12,0,Math.PI), new THREE.MeshBasicMaterial({color:'#fff'})))); g.add(noOut(mesh(new THREE.PlaneGeometry(0.08,0.05), new THREE.MeshBasicMaterial({color:'#fff'}), [0,-0.025,0]))); return g; }

// ---------- NPCs ----------
function label(text, w=1, bg=P.panel, fg=P.ink){ const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128; const c = cv.getContext('2d');
  c.fillStyle = bg; c.beginPath(); c.roundRect(4,4,504,120,24); c.fill(); c.lineWidth = 8; c.strokeStyle = P.ink; c.stroke();
  c.fillStyle = fg; c.font = '800 58px "Avenir Next", "Helvetica Neue", Arial'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(text, 256, 68);
  const t = new THREE.CanvasTexture(cv); t.colorSpace = THREE.SRGBColorSpace; const m = new THREE.Mesh(new THREE.PlaneGeometry(w, w/4), new THREE.MeshBasicMaterial({map:t, transparent:true})); m.userData.noOutline = true; return m; }
function ghostie(o={}){
  const g = new THREE.Group(), b = new THREE.Group(); g.add(b);
  const m = toon(P.ghost);
  b.add(mesh(new THREE.SphereGeometry(0.2,20,10,0,Math.PI*2,0,Math.PI/2), m, [0,0.18,0]));
  b.add(mesh(new THREE.CylinderGeometry(0.2,0.23,0.18,20,1,true), m, [0,0.09,0]));
  for (let i=0;i<5;i++){ const a = i/5*Math.PI*2; b.add(mesh(new THREE.SphereGeometry(0.05,10,8), m, [Math.sin(a)*0.21,0,Math.cos(a)*0.21])); }
  for (const x of [-0.06,0.06]) b.add(noOut(mesh(new THREE.SphereGeometry(0.025,10,8), inkMat, [x,0.22,0.185], [0,0,0], [1,1.3,0.6])));
  const acc = o.acc || 'tie', faded = toon('#C8C0D8');
  if (acc==='tie') { b.add(mesh(new THREE.BoxGeometry(0.05,0.12,0.02), faded, [0,0.08,0.225], [0.1,0,0])); }
  if (acc==='glasses') for (const x of [-0.06,0.06]) b.add(noOut(mesh(new THREE.TorusGeometry(0.04,0.009,6,14), toon('#9b92ad'), [x,0.22,0.2])));
  if (acc==='headset') { b.add(mesh(new THREE.TorusGeometry(0.21,0.015,6,20,Math.PI), faded, [0,0.2,0], [0,Math.PI/2,0])); b.add(mesh(new THREE.SphereGeometry(0.03,8,6), faded, [0.12,0.12,0.16])); }
  if (o.badge !== false) { const l = label('Seen ✓', 0.34, P.panel, P.purple); l.position.set(0.24,0.42,0.05); b.add(l); }
  b.position.y = o.float ?? 0.3;
  outline(g); return g;
}
function recruiter(o={}){ const r = pawn({shirt:P.suit, tie:P.coral, expr:o.expr||'wide', hairStyle:'swoop', hair:'#5a3b2a', scale:1.05});
  const hd = r.userData.head; hd.add(mesh(new THREE.TorusGeometry(0.2,0.016,6,20,Math.PI), toon(P.coral), [0,0.02,0], [0,Math.PI/2,0])); hd.add(mesh(new THREE.SphereGeometry(0.035,8,6), toon(P.coral), [0.14,-0.11,0.12]));
  const cb = new THREE.Group(); cb.add(mesh(new THREE.BoxGeometry(0.16,0.22,0.02), toon('#C9A27A'))); cb.add(noOut(mesh(new THREE.BoxGeometry(0.12,0.16,0.005), toon('#ffffff'), [0,-0.01,0.012]))); cb.position.set(-0.27,0.3,0.06); cb.rotation.x=-0.3; r.children[0].add(cb);
  outline(r); return r; }
function ats9000(){ const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(0.6,0.55,0.45), toon(P.robot), [0,0.45,0]));
  for (const x of [-0.2,0.2]) g.add(mesh(new THREE.CapsuleGeometry(0.09,0.3,4,10), toon('#4b5563'), [x,0.1,0], [Math.PI/2,0,0]));
  g.add(mesh(new THREE.BoxGeometry(0.5,0.4,0.42), toon('#9fb0bf'), [0,0.95,0]));
  g.add(noOut(mesh(new THREE.BoxGeometry(0.42,0.16,0.02), inkMat, [0,0.97,0.215])));
  for (const x of [-0.1,0.1]) g.add(noOut(mesh(new THREE.BoxGeometry(0.08,0.04,0.02), new THREE.MeshBasicMaterial({color:'#FFF8EE'}), [x,0.98,0.228])));
  g.add(mesh(new THREE.CylinderGeometry(0.012,0.012,0.18,6), toon(P.ink), [0,1.24,0])); g.add(noOut(mesh(new THREE.SphereGeometry(0.04,10,8), toon(P.gold,{emissive:P.gold, ei:0.6}), [0,1.34,0])));
  g.add(mesh(new THREE.CylinderGeometry(0.16,0.1,0.12,12), toon('#7b8794'), [0,0.78,0]));
  const arm = new THREE.Group(); arm.add(mesh(new THREE.BoxGeometry(0.08,0.35,0.08), toon('#7b8794'), [0,-0.15,0])); arm.add(mesh(new THREE.BoxGeometry(0.22,0.1,0.14), toon(P.redInk), [0,-0.34,0]));
  arm.position.set(0.36,0.65,0.05); arm.rotation.z = 0.5; g.add(arm);
  const st = label('NOT A FIT', 0.5, P.panel, P.redInk); st.position.set(0,0.45,0.23); g.add(st);
  outline(g); return g; }
function auntieDot(){ const d = pawn({shirt:'#8C6BB1', hair:'#DADADA', hairStyle:'bun', glasses:true, expr:'smile', scale:0.9, legs:'#5a4a6a'});
  const mug = new THREE.Group(); mug.add(mesh(new THREE.CylinderGeometry(0.05,0.045,0.1,12), toon('#FFF8EE'))); mug.add(mesh(new THREE.TorusGeometry(0.03,0.01,6,10), toon('#FFF8EE'), [0.055,0,0]));
  mug.position.set(0.25,0.33,0.08); d.children[0].add(mug); d.userData.armR.rotation.z = 0.9; outline(d); return d; }
function brett(){ const b = pawn({shirt:'#6FBF73', expr:'smug', scale:1.12, hairStyle:'swoop', hair:'#c79a52', legs:'#3a4a3a'});
  b.userData.head.add(mesh(new THREE.TorusGeometry(0.15,0.02,6,24), toon('#2E9E5B'), [0,0.3,0], [Math.PI/2,0,0]));
  const ph = mesh(new THREE.BoxGeometry(0.08,0.14,0.015), toon(P.ink), [0.24,0.42,0.12], [0,-0.4,0]); b.children[0].add(ph); b.userData.armR.rotation.z = 1.2;
  outline(b); return b; }
function juno(){ const j = pawn({shirt:'#FFF1DC', expr:'smile', hairStyle:'bun', hair:'#2b1e16', legs:'#3a2a22'});

function lights(scene, week=1, fill='#fff6e8', ground='#d9a877', range=20, azOverride=null){
  const el = (62 - 4.5*(week-1)) * Math.PI/180, az = (azOverride ?? (140 + 10*(week-1))) * Math.PI/180;
  const col = new THREE.Color('#fff3dc').lerp(new THREE.Color('#ffb46b'), (week-1)/11);
  scene.add(new THREE.HemisphereLight(fill, ground, 0.9 + (week>8?0.35:0)));
  const sun = new THREE.DirectionalLight(col, 2.6 + 0.4*(week-1)/11);
  sun.position.set(Math.sin(az)*Math.cos(el)*40, Math.sin(el)*40, Math.cos(az)*Math.cos(el)*40); sun.castShadow = true;
  sun.shadow.mapSize.set(4096,4096); Object.assign(sun.shadow.camera, {left:-range,right:range,top:range,bottom:-range, near:1, far:120}); sun.shadow.bias = -0.0015; sun.shadow.normalBias = range>5?0.12:0.02;
  scene.add(sun); scene.add(new THREE.AmbientLight('#ffffff', 0.25)); }

window.render = async (cfg) => {
  const W = cfg.w || 600, H = cfg.h || 600; renderer.setSize(W, H, false); canvas.style.width = W+'px'; canvas.style.height = H+'px';
  const scene = new THREE.Scene();
  let camera;
  if (cfg.kind === 'char') {
    scene.background = new THREE.Color(cfg.bg || '#FDE6C8');
    lights(scene, 1, '#fff6e8', '#e9c49a', 3, 25);
    charStage(scene);
    let obj;
    const k = cfg.who;
    if (k==='hero') obj = hero(cfg.opt || {});
    if (k==='ghost') obj = ghostie(cfg.opt || {});
    if (k==='recruiter') obj = recruiter();
    if (k==='ats') obj = ats9000();
    if (k==='dot') obj = auntieDot();
    if (k==='brett') obj = brett();
    if (k==='juno') obj = juno();
    if (k==='panel') obj = panelGroup();
    if (k==='gary') obj = gary();
    if (k==='r2g') obj = recruiterToGhost(cfg.step);
    obj.rotation.y = (cfg.angle || 0) * Math.PI/180; scene.add(obj);
    if (cfg.door) { const d = new THREE.Group(); d.add(mesh(new THREE.BoxGeometry(0.9,1.4,0.08), toon(P.wood), [0,0.7,0])); d.add(mesh(new THREE.SphereGeometry(0.04,8,6), toon(P.gold), [0.32,0.7,0.06])); d.add(mesh(new THREE.BoxGeometry(1.1,0.1,0.12), toon(P.ink), [0,1.45,0])); d.position.set(-0.95,0,-0.4); scene.add(d); }
    const fov = cfg.fov || 22; camera = new THREE.PerspectiveCamera(fov, W/H, 0.05, 100);
    const ty = cfg.ty ?? 0.5, dist = cfg.dist ?? 3.4; camera.position.set(cfg.cx || 0, cfg.cy ?? 0.6, dist); camera.lookAt(cfg.cx || 0, ty, 0);
  } else if (cfg.kind === 'world') {
    const d = cfg.district; const [top, hor] = SKY[d] || SKY.applyside;
    scene.background = skyTex(top, hor);
    lights(scene, cfg.week || WEEK[d], top, '#d9a877', 18);
    const block = DISTRICTS[d](); scene.add(block);
