<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><path d="M796,470 L870,470 L870,572 L811,572 Z" fill="#FDE6C8" stroke="none"/><path d="M786,512 L802,512 L806,552 L786,552 Z" fill="#F3E3C6" stroke="none"/><path d="M788,440 C794,480 804,540 814,594" fill="none" stroke="#2B1E16" stroke-width="6.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M706,610 L782,684" fill="none" stroke="#F3E3C6" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/><path d="M748,736 L792,748 L790,776 L770,776 Z" fill="#F3E3C6" stroke="none"/><g transform="translate(652,574) rotate(-6) scale(1.9620000000000002,2.18) translate(-219,-173)"><path d="M218,179 C211,175 204,173 198,174 C200,181 204,189 208,195 C211,189 215,184 218,179 Z" fill="#F8F4EA" stroke="#2B1E16" stroke-width="1.6830000000000003" stroke-linejoin="round" stroke-linecap="round"/><path d="M220,179 C227,175 234,173 240,174 C238,181 234,189 230,195 C227,189 223,184 220,179 Z" fill="#F8F4EA" stroke="#2B1E16" stroke-width="1.6830000000000003" stroke-linejoin="round" stroke-linecap="round"/><path d="M214,196 C214.1,216 212.2,238 210.95,254 L226,272 L238.95,254 C234.2,238 228.1,216 224,196 Z" fill="#C9A6D6" stroke="#2B1E16" stroke-width="2.295" stroke-linejoin="round" stroke-linecap="round"/><path d="M210,180 L228,180 L225,195 L213,195 Z" fill="#C9A6D6" stroke="#2B1E16" stroke-width="2.295" stroke-linejoin="round" stroke-linecap="round"/></g><ellipse cx="744" cy="648" rx="52" ry="52" fill="none" stroke="#1D63C8" stroke-width="3"/><path d="M789,621 L898,554" fill="none" stroke="#1D63C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="910" cy="554" rx="12" ry="12" fill="#1D63C8" stroke="none"/><ellipse cx="772" cy="758" rx="30" ry="30" fill="none" stroke="#1D63C8" stroke-width="3"/><path d="M799,745 L898,694" fill="none" stroke="#1D63C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="910" cy="694" rx="12" ry="12" fill="#1D63C8" stroke="none"/><ellipse cx="812" cy="772" rx="22" ry="22" fill="none" stroke="#1D63C8" stroke-width="3"/><path d="M832,781 L898,814" fill="none" stroke="#1D63C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="910" cy="814" rx="12" ry="12" fill="#1D63C8" stroke="none"/><ellipse cx="655" cy="650" rx="92" ry="92" fill="none" stroke="#1D63C8" stroke-width="3"/><path d="M571,688 L118,894" fill="none" stroke="#1D63C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="130" cy="894" rx="12" ry="12" fill="#1D63C8" stroke="none"/><ellipse cx="560" cy="300" rx="40" ry="40" fill="none" stroke="#1D63C8" stroke-width="3"/><path d="M522,287 L118,154" fill="none" stroke="#1D63C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="130" cy="154" rx="12" ry="12" fill="#1D63C8" stroke="none"/><text x="910" y="559" font-family="Helvetica" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text><text x="928" y="560" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1D63C8" text-anchor="start">Remove the ink crease</text><text x="928" y="580" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">(hull shows through</text><text x="928" y="600" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">the concave join)</text><text x="910" y="699" font-family="Helvetica" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text><text x="928" y="700" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1D63C8" text-anchor="start">Fill the pale root wedge:</text><text x="928" y="720" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">one flat body tone</text><text x="910" y="819" font-family="Helvetica" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text><text x="928" y="820" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1D63C8" text-anchor="start">Underside ink starts inside</text><text x="928" y="840" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">the body (hook): close it</text><text x="928" y="860" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">on the outline</text><text x="130" y="899" font-family="Helvetica" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text><text x="148" y="900" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1D63C8" text-anchor="start">New tie: B, slipped</text><text x="148" y="920" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">knot below the eye line,</text><text x="148" y="940" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">hangs down off-centre,</text><text x="148" y="960" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">V clear of the arm</text><text x="130" y="159" font-family="Helvetica" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text><text x="148" y="160" font-family="Helvetica" font-size="16" font-weight="bold" fill="#1D63C8" text-anchor="start">Opinion: dome shows flat</text><text x="148" y="180" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">facets at card size; smooth</text><text x="148" y="200" font-family="Helvetica" font-size="16" font-weight="normal" fill="#1D63C8" text-anchor="start">within budget (Viet)</text><text x="30" y="1170" font-family="Helvetica" font-size="20" font-weight="bold" fill="#1D63C8" text-anchor="start">Paint-over on v5/hero.png. Blue = notes for Viet. Old tie erased; new tie B painted at card scale.</text></svg>