,292 C42,278 45,266 49,254 C43,258 36,261 30,260 C18,258 16,244 24,239 C32,232 42,227 51,222 C53,190 54,162 56,134 C58,72 96,36 150,36 Z" fill="#F8F4EA" stroke="#2B1E16" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M70,110 C62,150 60,200 62,240 C64,268 70,288 80,306 C66,302 48,300 44,288 C47,262 52,226 56,190 C58,160 60,130 70,110 Z" fill="#EAE6DC" stroke="none"/><ellipse cx="124" cy="150" rx="8.5" ry="13" fill="#2B1E16" stroke="none"/><ellipse cx="176" cy="150" rx="8.5" ry="13" fill="#2B1E16" stroke="none"/><path d="M206,174 C199,170 192,168 186,169 C188,176 192,184 196,190 C199,184 203,179 206,174 Z" fill="#F8F4EA" stroke="#2B1E16" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M208,174 C215,170 222,168 228,169 C226,176 222,184 218,190 C215,184 211,179 208,174 Z" fill="#F8F4EA" stroke="#2B1E16" stroke-width="2.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M216,176 C233,167 251,181 269,169 L299,177 L277,199 C257,205 237,193 216,190 Z" fill="#C9A6D6" stroke="#2B1E16" stroke-width="3.75" stroke-linejoin="round" stroke-linecap="round"/><path d="M198,175 L216,175 L217,190 L205,190 Z" fill="#C9A6D6" stroke="#2B1E16" stroke-width="3.75" stroke-linejoin="round" stroke-linecap="round"/></g></g><rect x="472" y="96" width="446" height="1390" rx="18" fill="none" stroke="#1D63C8" stroke-width="5"/><rect x="800" y="140" width="108" height="34" rx="8" fill="#1D63C8" stroke="none"/><text x="30" y="46" font-family="Helvetica" font-size="30" font-weight="bold" fill="#2B1E16" text-anchor="start">GHOSTED: Ghostie tie options (Illustrator sketch, 2026-11-25)</text><text x="30" y="76" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Same body for all three. Card size = v5 variants panel scale. Game camera = 26 m, pitch 42, 1.6 px outline, shown x3 nearest like v5/lineup-grass-crop-x3.png.</text><text x="40" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">A. Hangs centre front (like Kit)</text><text x="40" y="1330" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Card: reads as a TIE (knot, blade, V, collar).</text><text x="40" y="1354" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Game camera: a lilac+ink bar CENTRED under</text><text x="40" y="1378" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">the eye dots. Reads as a mouth or tongue.</text><text x="40" y="1402" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">FAILS the no-mouth test. Rejected.</text><text x="490" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">B. Slipped: hangs, off-centre</text><text x="490" y="1330" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Card: reads as a TIE (knot, blade, V, collar),</text><text x="490" y="1354" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">hanging askew: the recruiter stopped caring.</text><text x="490" y="1378" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Game camera: small lilac mark beside the arm,</text><text x="490" y="1402" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">out of the mouth zone. Nothing centred. PICK.</text><text x="940" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">C. Blown aside past the outline</text><text x="940" y="1330" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Card: knot + blade + V, but the blade lies</text><text x="940" y="1354" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">flat in the air: flag / horn risk (v1-v5).</text><text x="940" y="1378" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Game camera: a bar out of the face at eye level:</text><text x="940" y="1402" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">reads as a cigarette. Hits the arm_L wave. Rejected.</text><text x="1390" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">Kit (reference, locked)</text><text x="1390" y="1330" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Kit's tie: wide knot under a collar, blade</text><text x="1390" y="1354" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">widens to a V, ink all round, hangs straight.</text><text x="1390" y="1378" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Source: assets/kit/hero.png,</text><text x="1390" y="1402" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">v5/lineup-grass-crop-x3.png (Kit).</text><text x="30" y="690" font-family="Helvetica" font-size="18" font-weight="bold" fill="#1D63C8" text-anchor="start">Tie close-up (x2.4 of card)</text><text x="30" y="1018" font-family="Helvetica" font-size="18" font-weight="bold" fill="#1D63C8" text-anchor="start">Game camera x3: clean, mouth zone, 1x</text><text x="854" y="165" font-family="Helvetica" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PICK</text></svg>