mily="Helvetica" font-size="28" font-weight="bold" fill="#2B1E16" text-anchor="start">GHOSTED: Ghostie tie, centred under a collar (sketch v2), next to Kit</text><text x="30" y="76" font-family="Helvetica" font-size="17" font-weight="normal" fill="#2B1E16" text-anchor="start">Upright front view at card scale; close-up; 2D game-camera estimate (x3, with the mouth zone as a blue box; 1x).</text><text x="40" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">Ghostie: tie centred</text><text x="780" y="120" font-family="Helvetica" font-size="21" font-weight="bold" fill="#2B1E16" text-anchor="start">Kit (reference, locked)</text><text x="30" y="640" font-family="Helvetica" font-size="18" font-weight="bold" fill="#1D63C8" text-anchor="start">Close-up (x2.4 of card)</text><text x="30" y="960" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">Ghostie: card read - knot under a collar, blade widens, V point, ink all round,</text><text x="30" y="982" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">hangs straight down the centre like Kit's. Game camera (estimate): the knot is 7 px (1x)</text><text x="30" y="1004" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">under the eye dots, only 1-2 px clear. Opinion: in this estimate the centred tie reads</text><text x="30" y="1026" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">like a tongue under the eyes. Viet's real render decides (bodymap-brief, next steps).</text><text x="780" y="960" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">Kit: assets/kit/hero.png (card, close-up);</text><text x="780" y="982" font-family="Helvetica" font-size="16" font-weight="normal" fill="#2B1E16" text-anchor="start">v5/lineup-grass-crop-x3.png (game camera).</text></svg>