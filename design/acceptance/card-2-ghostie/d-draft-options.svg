<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="825" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Draw a 2D draft before the 3D model?</text>
<rect x="40" y="110" width="420" height="675" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">1. Draw first, then model</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator draws the Ghostie:</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">front, 3/4, side, back</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Same sheet: 3 variants</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">+ 26 m game-size thumbnail</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Seats score the drawing,</text>
<text x="250.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">then you accept or redo it</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet models to match it.</text>
<text x="250.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">New gate item: matches drawing</text>
<line x1="250.0" y1="575" x2="250.0" y2="597" stroke="#334155" stroke-width="3"/><polygon points="242.0,589 258.0,589 250.0,600" fill="#334155"/>
<rect x="70" y="600" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="620" font-size="19" fill="#1e1b4b" text-anchor="middle">Same order for Ricky, ATS-9000</text>
<text x="250.0" y="644" font-size="19" fill="#1e1b4b" text-anchor="middle">and every later design</text>
<text x="70" y="715" font-size="18" fill="#475569">Kit stays locked.</text>
<text x="70" y="739" font-size="18" fill="#475569">3D v3 stays paused.</text>
<rect x="490" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">2. Finish 3D v3 first</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet finishes v3 from the</text>
<text x="700.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">written spec, as now</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">5 seats score v3</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Draw a 2D sheet only</text>
<text x="700.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">if v3 fails again</text>
<text x="520" y="525" font-size="18" fill="#475569">Faster if v3 passes.</text>
<text x="520" y="549" font-size="18" fill="#475569">v1 and v2 failed this way.</text>
<rect x="940" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">3. Draw first, Kit too</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Same as option 1 for the</text>
<text x="1150.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">Ghostie and all later designs</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator also draws Kit</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Kit is re-modelled if the</text>
<text x="1150.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">drawing differs from v5</text>
<text x="970" y="525" font-size="18" fill="#475569">Re-opens Kit,</text>
<text x="970" y="549" font-size="18" fill="#475569">which you accepted.</text>
</svg>