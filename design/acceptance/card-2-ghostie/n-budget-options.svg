<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="730" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Ghostie 3D: how smooth must the outline be?</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">1. Raise to 800 per ghost</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">24 ghosts = 19.2k triangles</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">(about 8 Kits)</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">v7: smooth dome + round hem</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">scallops, like the sketch</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">+ wave morph (Viet),</text>
<text x="250.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">+ rest pose (Emil)</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">5-seat 3D gate, then 3D card</text>
<text x="70" y="620" font-size="18" fill="#475569">Closest to the sketch.</text>
<text x="70" y="644" font-size="18" fill="#475569">One more build pass.</text>
<rect x="490" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">2. Keep 600, accept steps</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Outline keeps small</text>
<text x="700.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">straight steps at card size</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">+ wave morph, + rest pose</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">5-seat 3D gate, then 3D card</text>
<text x="520" y="525" font-size="18" fill="#475569">Fastest. Card close-ups</text>
<text x="520" y="549" font-size="18" fill="#475569">show the facets.</text>
<rect x="940" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">3. 600 + smooth ink only</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Body stays 600</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">A smoother outline shell</text>
<text x="1150.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">is drawn at run time</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Outline smooth, inner</text>
<text x="1150.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">shading stays faceted</text>
<text x="970" y="525" font-size="18" fill="#475569">Extra GPU triangles hidden</text>
<text x="970" y="549" font-size="18" fill="#475569">in the outline; mixed look.</text>
</svg>