<svg xmlns="http://www.w3.org/2000/svg" width="950" height="920" font-family="Helvetica, Arial, sans-serif">
<rect width="950" height="920" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">What supports the 3D model before Blender?</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">1. Sketch only (rule today)</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator 2D sketch</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">turnaround + game thumbnail</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Seats + you accept the sketch</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet models the full asset</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">5-seat gate on the final model</text>
<text x="70" y="620" font-size="18" fill="#475569">Faults in 3D-only things (joins,</text>
<text x="70" y="644" font-size="18" fill="#475569">outline, camera read) show late.</text>
<rect x="490" y="110" width="420" height="770" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">2. Sketch + blockout + paint-over</text>
<rect x="760" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="825" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Brief: budget, game camera,</text>
<text x="700.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">motion parts (Emil), palette</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Reference board + Viet direction.md</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">(skill steps 1-5, saved)</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator sketch, you accept it</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet blockout: rough shape,</text>
<text x="700.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">joins decided, at game camera</text>
<line x1="700.0" y1="575" x2="700.0" y2="597" stroke="#334155" stroke-width="3"/><polygon points="692.0,589 708.0,589 700.0,600" fill="#334155"/>
<rect x="520" y="600" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="620" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator paints over the</text>
<text x="700.0" y="644" font-size="19" fill="#1e1b4b" text-anchor="middle">blockout render; seats quick check</text>
<line x1="700.0" y1="670" x2="700.0" y2="692" stroke="#334155" stroke-width="3"/><polygon points="692.0,684 708.0,684 700.0,695" fill="#334155"/>
<rect x="520" y="695" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="715" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet final model, 5-seat gate,</text>
<text x="700.0" y="739" font-size="19" fill="#1e1b4b" text-anchor="middle">then your card</text>
<text x="520" y="810" font-size="18" fill="#475569">Two cheap checks before</text>
<text x="520" y="834" font-size="18" fill="#475569">the expensive Blender detail.</text>
</svg>