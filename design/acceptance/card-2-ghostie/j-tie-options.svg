<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="825" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="825" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">The centred tie reads as a mouth at the game camera. What now?</text>
<rect x="40" y="110" width="420" height="675" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">1. Swap the tie for a held prop</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Glasses + headset stay</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">(both read, centred)</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">3rd variant holds a recruiter prop</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">in arm_R: clipboard, mug, phone</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator sketches 3 props;</text>
<text x="250.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">blockout render at game camera</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">Prop sits at the side:</text>
<text x="250.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">never in the mouth zone</text>
<line x1="250.0" y1="575" x2="250.0" y2="597" stroke="#334155" stroke-width="3"/><polygon points="242.0,589 258.0,589 250.0,600" fill="#334155"/>
<rect x="70" y="600" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="630" font-size="19" fill="#1e1b4b" text-anchor="middle">You accept, then the 3D build</text>
<text x="70" y="715" font-size="18" fill="#475569">Keeps 3 variants and the</text>
<text x="70" y="739" font-size="18" fill="#475569">no-mouth joke. Loses the tie.</text>
<rect x="490" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">2. Tie at card size only</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Tie shows on cards</text>
<text x="700.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">and close-ups</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">In game the tie ghost</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">hides the tie (plain ghost)</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">2 variants read in game</text>
<text x="520" y="525" font-size="18" fill="#475569">Cheap. Players lose one</text>
<text x="520" y="549" font-size="18" fill="#475569">recruiter cue in game.</text>
<rect x="940" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">3. Change the no-mouth rule</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Bible: &#x27;a ghost never replies&#x27;</text>
<text x="1150.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">is dropped</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="345" font-size="19" fill="#1e1b4b" text-anchor="middle">Centred tie stays as built</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="430" font-size="19" fill="#1e1b4b" text-anchor="middle">Ghosts read as &#x27;o&#x27; mouth</text>
<text x="1150.0" y="454" font-size="19" fill="#1e1b4b" text-anchor="middle">or tongue out in game</text>
<text x="970" y="525" font-size="18" fill="#475569">Breaks the main joke</text>
<text x="970" y="549" font-size="18" fill="#475569">(BMGD, bible L30).</text>
</svg>