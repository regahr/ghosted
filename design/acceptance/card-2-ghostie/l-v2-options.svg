<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="730" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">Sketch v2 failed 5 of 5 on small visible flaws. Next?</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">1. One 2D fix pass (sketch v3)</text>
<rect x="310" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="375" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Illustrator fixes the merged list</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">(headset, glasses, arm, 3/4, side, labels)</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Chair 2x check, then only the</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">seats whose items changed</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Card 2 to you</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Then 3D build to the sketch</text>
<text x="70" y="620" font-size="18" fill="#475569">2D only, no Blender.</text>
<text x="70" y="644" font-size="18" fill="#475569">About 1 pass.</text>
<rect x="490" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">2. Fix in 3D directly</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Accept sketch v2 + the fix list</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Viet builds the final 3D</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">with the fixes</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">5-seat 3D gate checks them</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">3D card to you</text>
<text x="520" y="620" font-size="18" fill="#475569">Skips a sketch pass, but you</text>
<text x="520" y="644" font-size="18" fill="#475569">accept a sketch with known flaws.</text>
<rect x="940" y="110" width="420" height="485" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">3. Park the Ghostie</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Keep sketch v2 + fix list on file</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Start Recruiter Ricky</text>
<text x="1150.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">(body map first)</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Return to the Ghostie later</text>
<text x="970" y="525" font-size="18" fill="#475569">Moves the game forward;</text>
<text x="970" y="549" font-size="18" fill="#475569">card 2 stays open.</text>
</svg>