<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="730" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="730" fill="#f8fafc"/>
<text x="40" y="60" font-size="34" font-weight="bold" fill="#0f172a">A1. What is the acceptance panel for each design?</text>
<rect x="40" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="60" y="150" font-size="26" font-weight="bold" fill="#0f172a">a. Seats are the panel</text>
<rect x="70" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="240" font-size="19" fill="#1e1b4b" text-anchor="middle">Seat draws one design</text>
<text x="250.0" y="264" font-size="19" fill="#1e1b4b" text-anchor="middle">(Kit, Ricky, Applyside ...)</text>
<line x1="250.0" y1="290" x2="250.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="242.0,304 258.0,304 250.0,315" fill="#334155"/>
<rect x="70" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">5 seats score it on a</text>
<text x="250.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">written checklist</text>
<line x1="250.0" y1="385" x2="250.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="242.0,399 258.0,399 250.0,410" fill="#334155"/>
<rect x="70" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">All pass: design is final</text>
<line x1="250.0" y1="480" x2="250.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="242.0,494 258.0,494 250.0,505" fill="#334155"/>
<rect x="70" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="250.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Any fail: redo, score again</text>
<text x="70" y="620" font-size="18" fill="#475569">You see only finished designs.</text>
<text x="70" y="644" font-size="18" fill="#475569">You do not approve each one.</text>
<rect x="490" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="510" y="150" font-size="26" font-weight="bold" fill="#0f172a">b. You are the panel</text>
<rect x="520" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Seat draws one design</text>
<line x1="700.0" y1="290" x2="700.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="692.0,304 708.0,304 700.0,315" fill="#334155"/>
<rect x="520" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">Card posted in the thread</text>
<text x="700.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">with a number</text>
<line x1="700.0" y1="385" x2="700.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="692.0,399 708.0,399 700.0,410" fill="#334155"/>
<rect x="520" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">You reply: 3 accept, 4 redo</text>
<line x1="700.0" y1="480" x2="700.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="692.0,494 708.0,494 700.0,505" fill="#334155"/>
<rect x="520" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="700.0" y="535" font-size="19" fill="#1e1b4b" text-anchor="middle">Redo goes back to the seat</text>
<text x="520" y="620" font-size="18" fill="#475569">You see every draft,</text>
<text x="520" y="644" font-size="18" fill="#475569">also the weak ones.</text>
<rect x="940" y="110" width="420" height="580" rx="16" fill="#ffffff" stroke="#16a34a" stroke-width="4"/>
<text x="960" y="150" font-size="26" font-weight="bold" fill="#0f172a">c. Seats first, then you</text>
<rect x="1210" y="170" width="130" height="32" rx="16" fill="#16a34a"/><text x="1275" y="192" font-size="18" fill="#fff" text-anchor="middle" font-weight="bold">My pick</text>
<rect x="970" y="220" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="250" font-size="19" fill="#1e1b4b" text-anchor="middle">Seat draws one design</text>
<line x1="1150.0" y1="290" x2="1150.0" y2="312" stroke="#334155" stroke-width="3"/><polygon points="1142.0,304 1158.0,304 1150.0,315" fill="#334155"/>
<rect x="970" y="315" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="335" font-size="19" fill="#1e1b4b" text-anchor="middle">5 seats score it on the checklist</text>
<text x="1150.0" y="359" font-size="19" fill="#1e1b4b" text-anchor="middle">(fail: redo before you see it)</text>
<line x1="1150.0" y1="385" x2="1150.0" y2="407" stroke="#334155" stroke-width="3"/><polygon points="1142.0,399 1158.0,399 1150.0,410" fill="#334155"/>
<rect x="970" y="410" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="440" font-size="19" fill="#1e1b4b" text-anchor="middle">Card posted in the thread</text>
<line x1="1150.0" y1="480" x2="1150.0" y2="502" stroke="#334155" stroke-width="3"/><polygon points="1142.0,494 1158.0,494 1150.0,505" fill="#334155"/>
<rect x="970" y="505" width="360" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
<text x="1150.0" y="525" font-size="19" fill="#1e1b4b" text-anchor="middle">You reply accept or redo.</text>
<text x="1150.0" y="549" font-size="19" fill="#1e1b4b" text-anchor="middle">Accepted = locked for the build</text>
<text x="970" y="620" font-size="18" fill="#475569">You see only drafts that passed.</text>
<text x="970" y="644" font-size="18" fill="#475569">You keep the final call.</text>
</svg>